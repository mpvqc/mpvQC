version = 1

[[annotations]]
path = "**/*.md"
precedence = "aggregate"
SPDX-FileCopyrightText = "mpvQC developers"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [
    ".github/ISSUE_TEMPLATE/**",
    ".github/[QC]_screenshot-qc.txt",
    ".github/screenshots/**",
    "build-aux/windows-icon.ico",
    "build-aux/windows-splash.png",
    "data/palette-catalog.json",
    "data/config/**",
    "i18n/**",
    "testqml/fixtures/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "mpvQC developers"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = [
    ".idea/inspectionProfiles/Project_Default.xml",
    "docs/document-format/*.json",
    "uv.lock",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "mpvQC developers"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "data/fonts/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "The Noto Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "data/icons/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "Google Inc."
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "NOTICE.txt"
precedence = "aggregate"
SPDX-FileCopyrightText = "mpvQC developers"
SPDX-License-Identifier = "Apache-2.0 AND BSD-3-Clause AND GPL-2.0-or-later AND GPL-3.0-or-later AND LGPL-3.0-only AND MIT AND OFL-1.1"
