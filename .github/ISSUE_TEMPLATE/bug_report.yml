name: Bug report
description: Create a report to help us improve
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem.
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Windows
        - Linux
        - Other
  - type: input
    id: version
    attributes:
      label: Version
      description: >
        Paste the version info from `Help` ⟶ `About mpvQC...` (copy button) or `mpvQC --version`.
        The line ends in your build's origin.
      placeholder: mpvQC 0.9.0 (0b3138ac) unofficial
    validations:
      required: true
  - type: textarea
    id: mpv-conf
    attributes:
      label: mpv.conf
      description: >
        If you have modified the mpv configuration (`Options` ⟶ `Edit mpv.conf...`), list all your
        changes or a copy of your config.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        Please attach the log file. Open `Help` ⟶ `Open App Data Folder...`, then grab `mpvQC.log`
        from the `logs/` folder.
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
