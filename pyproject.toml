[project]
name = "mpvQC"
version = "0.9.0-beta5"
description = "libmpv based application for quality control of videos"
readme = "README.md"
requires-python = "~=3.13.0"
classifiers = [
    "Development Status :: 4 - Beta",                                              # 4 - Beta, 5 - Production/Stable
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "Jinja2>=3.1.6",
    "PySide6-Essentials==6.11.1",
    "inject>=5.5.0",
    "mpv>=1.0.8",
]

[project.urls]
Homepage = "https://mpvqc.github.io"
Issues = "https://github.com/mpvqc/mpvQC/issues"
Repository = "https://github.com/mpvqc/mpvQC"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "materialyoucolor>=3.0.3",
    "prek>=0.4.11",
    "pyrefly>=1.1.1",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "types-jsonschema>=4.26.0.20260518",
]

[tool.uv]
required-version = ">=0.12.0"

