# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
    { id = "end-of-file-fixer" },
    { id = "trailing-whitespace" },
]

[[repos]]
repo = "https://github.com/biomejs/pre-commit"
rev = "v2.6.7"
hooks = [
    {
        id = "biome-check",
        name = "format json",
        files = '\.(jsonc?)$',
        exclude = '\.config/biome\.jsonc',
        args = ["--config-path=.config"],
    },
    {
        id = "biome-check",
        name = "format yml",
        files = '\.ya?ml$',
        args = ["--config-path=.config"],
    },
]

[[repos]]
repo = "local"
hooks = [
    {
        id = "actionlint",
        name = "lint workflows",
        entry = "actionlint",
        language = "system",
        files = '^\.github/workflows/.*\.ya?ml$',
    },
]

[[repos]]
repo = "https://github.com/tombi-toml/tombi-pre-commit"
rev = "v1.11.2"
hooks = [
    {
        id = "tombi-format",
        name = "format toml",
        exclude = "uv.lock",
        args = [
            "--offline",
        ]
    },
]

[[repos]]
repo = "https://github.com/rvben/rumdl-pre-commit"
rev = "v0.3.4"
hooks = [
    {
        id = "rumdl",
        name = "format md",
        exclude = ".github/",
        args = ["--fix", "--config", ".config/rumdl.toml"],
    },
]

[[repos]]
repo = "local"
hooks = [
    {
        id = "ruff",
        name = "lint py",
        entry = "ruff check",
        language = "system",
        types = ["python"],
        require_serial = true,
        args = ["--config", ".config/ruff.toml", "--fix"],
    },
    {
        id = "ruff-format",
        name = "format py",
        entry = "ruff format",
        language = "system",
        types = ["python"],
        require_serial = true,
        args = ["--config", ".config/ruff.toml"],
    },
    {
        id = "pyrefly",
        name = "typecheck py",
        entry = "pyrefly check",
        language = "system",
        types = ["python"],
        pass_filenames = false,
        require_serial = true,
        args = ["--config", ".config/pyrefly.toml"],
    },
]

[[repos]]
repo = "https://github.com/trin94/qml-import-sort"
rev = "v0.4.0"
hooks = [
    {
        id = "qml-import-sort",
        name = "sort qml imports",
        args = ["--group", "io.github.mpvqc.,MpvqcStyle"],
    },
]

[[repos]]
repo = "local"
hooks = [
    {
        id = "qmlformat",
        name = "format qml",
        entry = "pyside6-qmlformat",
        language = "system",
        files = '\.qml$',
        args = ["--settings", ".config/qmlformat.ini", "--inplace"],
    },
]

[[repos]]
repo = "https://github.com/fsfe/reuse-tool"
rev = "v6.3.0"
hooks = [
    {
        id = "reuse-lint-file",
        name = "lint licenses",
    },
]
